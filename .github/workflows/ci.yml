name: CI

# Build and test on every push and pull request. Never produces a release;
# releases come only from tags (see release.yml).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: swift --version
      - name: Unit tests
        run: make test
      - name: Build app bundle (ad-hoc signed)
        run: make app
      - name: Smoke-check the binary
        run: |
          build/MicroKeys.app/Contents/MacOS/MicroKeys --version
          build/MicroKeys.app/Contents/MacOS/MicroKeys --check-config config.example.json
