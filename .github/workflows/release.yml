name: Release

# Runs only when a tag like v0.3.0 is pushed. Merging PRs never triggers it.
#
#   echo 0.3.0 > VERSION && git commit -am "0.3.0" && git tag v0.3.0 && git push origin main v0.3.0
#
# One job per platform builds and uploads its artifacts; the final job creates
# the GitHub Release with everything at once, so a failure on any platform
# means no Release is published at all.
#
# macOS signs with the certificate in MACOS_CERT_P12 / MACOS_CERT_PASSWORD
# (identity name in the SIGN_IDENTITY variable). Add NOTARY_APPLE_ID /
# NOTARY_PASSWORD / NOTARY_TEAM_ID once a Developer ID certificate is in use
# and the build is notarized as well.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Tag must match VERSION
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(tr -d '[:space:]' < VERSION)"
          if [ "$tag" != "$version" ]; then
            echo "tag v$tag does not match VERSION ($version)" >&2
            exit 1
          fi

  macos:
    needs: check
    runs-on: macos-15
    defaults:
      run:
        working-directory: macos
    steps:
      - uses: actions/checkout@v5

      - name: Paths
        run: echo "KEYCHAIN=$RUNNER_TEMP/signing.keychain-db" >> "$GITHUB_ENV"

      - name: Import signing certificate
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          keychain_password="$(openssl rand -base64 24)"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"

          security create-keychain -p "$keychain_password" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$keychain_password" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db

          # A self-signed certificate must be explicitly trusted for code signing.
          openssl pkcs12 -in "$RUNNER_TEMP/cert.p12" -passin "pass:$CERT_PASSWORD" -nokeys -legacy \
            2>/dev/null > "$RUNNER_TEMP/cert.pem" \
            || openssl pkcs12 -in "$RUNNER_TEMP/cert.p12" -passin "pass:$CERT_PASSWORD" -nokeys > "$RUNNER_TEMP/cert.pem"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$RUNNER_TEMP/cert.pem"
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/cert.pem"

          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Unit tests
        run: make test

      - name: Build signed release
        env:
          SIGN_IDENTITY: ${{ vars.SIGN_IDENTITY }}
          NOTARY_PROFILE: ${{ secrets.NOTARY_APPLE_ID != '' && 'ci' || '' }}
        run: |
          set -euo pipefail
          if [ -n "${NOTARY_PROFILE}" ]; then
            xcrun notarytool store-credentials ci \
              --apple-id "${{ secrets.NOTARY_APPLE_ID }}" \
              --password "${{ secrets.NOTARY_PASSWORD }}" \
              --team-id "${{ secrets.NOTARY_TEAM_ID }}"
          fi
          make release

      - name: Verify signature
        run: codesign -dvv build/MicroKeys.app 2>&1 | grep -E "^(Authority|Signature)="

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            macos/dist/*.dmg
            macos/dist/*.zip
          if-no-files-found: error

      - name: Remove signing keychain
        if: always()
        run: security delete-keychain "$KEYCHAIN" || true

  windows:
    needs: check
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Unit tests
        run: dotnet test MicroKeys.Core.Tests -c Release
      - name: Publish
        run: |
          version="$(tr -d '[:space:]' < ../VERSION)"
          for rid in win-x64 win-arm64; do
            dotnet publish MicroKeys -c Release -r "$rid" -o "dist/$rid"
            rm -f "dist/$rid"/*.pdb
            (cd "dist/$rid" && 7z a -tzip "../MicroKeys-$version-$rid.zip" . >/dev/null)
          done
          ./dist/win-x64/MicroKeys.exe --version
          ls -la dist/*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: windows/dist/*.zip
          if-no-files-found: error

  publish:
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Checksums
        run: cd assets && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          notes="$(cat <<'EOT'
          ## macOS 安装

          1. 打开 dmg，把 MicroKeys 拖到 Applications。
          2. 第一次打开会被 Gatekeeper 拦（自签名，未公证）：去「系统设置 → 隐私与安全性」点「仍要打开」，或执行
             `xattr -dr com.apple.quarantine /Applications/MicroKeys.app`。
          3. 按提示授予「输入监控」和「辅助功能」权限。同一证书签名的后续版本不需要再授权。

          ## Windows 安装

          1. 下载 `MicroKeys-<版本>-win-x64.zip`（Arm 设备用 `win-arm64`），解压到任意目录，运行 `MicroKeys.exe`。
          2. 未签名，SmartScreen 会提示：点「更多信息 → 仍要运行」。不需要任何权限。
          3. 托盘图标右键菜单里可开启「开机自动启动」。

          配置说明见仓库 `docs/CONFIG.md`。
          EOT
          )"
          gh release create "$GITHUB_REF_NAME" assets/* \
            --title "MicroKeys ${GITHUB_REF_NAME#v}" --notes "$notes"
